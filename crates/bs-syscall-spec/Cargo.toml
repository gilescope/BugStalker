[package]
name = "bs-syscall-spec"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "BugStalker time-travel — Linux syscall specifications for the sub-phase 3B recorder (Phase 5)."

[dependencies]
# The curated Linux x86-64 table is now generated by the
# `syscall! { … }` DSL macro at compile time. Cargo allows the
# dev-dep cycle (bs-syscall-macro tests use bs-syscall-spec) —
# dev-dependencies are excluded from the link-graph cycle check.
bs-syscall-macro = { path = "../bs-syscall-macro" }

[dev-dependencies]
# Integrity tests only need std assertions.
