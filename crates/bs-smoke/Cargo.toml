# SPDX-License-Identifier: MIT
[package]
name = "bs-smoke"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "Phase 1 acceptance smoke driver. Spawns the `examples/vars` debuggee through `bugstalker`'s library API, breaks at the line where every Phase 1 stdlib type is in scope, then asserts each value renders via its specialised path (no fallback to raw `{ field: ... }` struct form)."

[[bin]]
name = "bs-smoke"
path = "src/main.rs"

# No bench targets. Disable libtest's bench harness so
# `cargo bench --workspace -- --quick` can pass criterion-only flags.
bench = false

[dependencies]
anyhow.workspace = true
bugstalker = { path = "../.." }
nix = "0.30"
os_pipe = "1"
