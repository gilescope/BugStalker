[package]
name = "bs-replay"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "BugStalker time-travel — Tier 2 fork-checkpoint replay (Phase 5)."

[dependencies]
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["process", "thread", "fs"] }
# nix gives us safe fork/waitpid/raise + Pid newtype. The root
# bugstalker crate already pins nix 0.27 with overlapping
# features; matching that here.
nix = { version = "0.27.1", features = ["process", "signal", "ptrace"] }

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.6"

[dev-dependencies]
proptest.workspace = true
