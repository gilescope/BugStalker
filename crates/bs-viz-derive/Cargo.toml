[package]
name = "bs-viz-derive"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Proc-macro behind `bs_viz_sdk::DebugView` — emits a `.bs_viz_spec` static."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
bs-viz-spec = { path = "../bs-viz-spec" }
