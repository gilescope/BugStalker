[package]
name = "bs-syscall-macro"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "BugStalker time-travel — syscall! { … } DSL macro for sub-phase 3B (Phase 5)."

[lib]
