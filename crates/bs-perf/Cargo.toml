[package]
name = "bs-perf"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "BugStalker performance overlay — PMU cycles+IP sampling (Phase 6)."

# Phase 6 implementation order (from doc/plans/phase-6-perf-overlay.md):
#
# - **Cycles + IP sampling + ring drain + PC resolver +
#   aggregator + overlay view models (steps 114-118).**
#   Universal tier. Pure Rust via `perf-event-open-sys` and
#   `libc` for the mmap/ioctl/close shell. Source resolution uses
#   `gimli` + `object`, matching BugStalker's existing DWARF stack;
#   overlay rows and serde-free DAP shapes give console, TUI, and
#   DAP a shared hot-line model.
#   Linux/x86_64 + Linux/aarch64.
#
# - **Intel PT tier.** The current crate has a pure-Rust host
#   capability probe and raw capture owner. Instruction decode is
#   behind the explicit `intel-pt` feature so the default build stays
#   C-dep-free. The plan's pure-Rust policy section anticipates this
#   exact gating: "A user running `cargo build` with no flags gets
#   zero C dependencies from Phase 6."
#
# - **Darwin kperf tier deferred.** Apple's private API requires
#   version-specific dlsym binding work; surfaces no functionality
#   the Linux tier doesn't already have. Darwin builds compile but
#   the perf monitor returns Unsupported.
#
# - **ARM SPE tier (future).** Stubbed: aarch64-linux currently
#   uses cycles+IP sampling like x86. SPE adds branch-record
#   precision but isn't a step-1 concern.

[lib]
bench = false

[features]
default = []
intel-pt = ["dep:libipt"]

[dependencies]
gimli = { workspace = true }
object = { workspace = true }
thiserror = { workspace = true }

# Pure-Rust typed bindings for the perf_event_open(2) syscall and
# its kernel UAPI structs. Phase 6 plan blesses this dep
# (§"Pure-Rust policy"). We don't use rustix for it — rustix
# doesn't yet expose perf_event_open.
[target.'cfg(target_os = "linux")'.dependencies]
perf-event-open-sys = "6.0"
libc = "0.2"

[target.'cfg(all(target_os = "linux", any(target_arch = "x86", target_arch = "x86_64")))'.dependencies]
libipt = { version = "0.4.0", optional = true }
