[package]
name = "bs-replay-driver"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "BugStalker time-travel — sub-phase 3I integration seam between the trace engine and the debugger (Phase 5)."

[dependencies]
thiserror.workspace = true
tracing.workspace = true
bs-replay-engine = { path = "../bs-replay-engine" }
# Tier 2 fork-checkpoint primitives. bs-replay compiles cross-
# platform (its Linux-only items are cfg-gated internally), so
# this dep is unconditional; the driver's record::capture_one_shot
# is itself cfg(target_os = "linux") for the recorder side.
bs-replay = { path = "../bs-replay" }
# RFC 3339 timestamp generation for capture_host_manifest. The
# format crate doesn't validate the encoding so chrono stays an
# implementation detail of the driver — the engine never sees it.
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }

# Darwin host_features() probes hw.optional.* via sysctlbyname.
# libc gives us the FFI bindings; the curated key list is in
# src/host.rs. Linux uses /proc/cpuinfo (std::fs).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# Linux DAP handlers (capture, restore) need nix::unistd::Pid for
# constructing target PIDs from i32. nix is a transitive dep via
# bs-replay; the explicit dep makes the import valid.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.27.1", features = ["process"] }

# Small support CLI — see crate-level docs.
[[bin]]
name = "replay-doctor"
path = "src/bin/replay-doctor.rs"

# replay-record drives the Phase 5 recorder against a user
# program. Linux only at the functional level; on Darwin the
# binary still builds with a stub main that reports the
# platform limitation cleanly.
[[bin]]
name = "replay-record"
path = "src/bin/replay-record.rs"

# replay-load drives the replay shim against a recorded trace
# + a fresh tracee. Symmetric to replay-record. Linux only at
# the functional level; on Darwin the binary stub-mains.
[[bin]]
name = "replay-load"
path = "src/bin/replay-load.rs"

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "recorder_throughput"
path = "benches/recorder_throughput.rs"
harness = false
