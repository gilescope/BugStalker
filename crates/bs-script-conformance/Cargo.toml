# SPDX-License-Identifier: MIT
[package]
name = "bs-script-conformance"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "Phase 9 scripting front-end conformance tests. Spawns `bs --script` against the example debuggees and replays a recorded transcript, asserting against the JSON-RPC response shape. Catches accidental schema or semantics regressions across the front-end."

[lib]
path = "src/lib.rs"
bench = false

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
# The ScriptClient API + Request/Response DTOs live in bugstalker. The
# conformance crate's purpose is to exercise both at once, so this is a
# load-bearing dep, not a circular accident.
bugstalker = { path = "../.." }

[dev-dependencies]
serial_test = "3"
