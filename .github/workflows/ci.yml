on: [push, pull_request]

name: CI

env:
  MSRV: 1.89.0
  LRV: 1.95.0

jobs:
  test:
    strategy:
      matrix:
        rustc_sup_version: [1.91.0, 1.92.0, 1.93.0, 1.94.0, 1.95.0]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Install debug symbols
        run: |
          sudo apt-get update
          sudo apt-get install libc6-dbg
      - name: Install rust toolchain
        run: |
          rustup toolchain install ${{ matrix.rustc_sup_version }}
          rustup toolchain install "$MSRV"
      - name: Build test applications for functional testing
        run: make build-examples-for-func-test RUST_VERSION=${{ matrix.rustc_sup_version }}
      - name: Verify test applications rustc version
        run: |
          strings examples/target/debug/calc | grep "^rustc version" | grep ${{ matrix.rustc_sup_version }}
      - name: Run functional tests
        run: cargo test

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Install rust
        run: |
          rustup toolchain install "$LRV"
          rustup toolchain install "$MSRV"
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
      - name: Install pip and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          if [ -f requirements.txt ]; then sudo pip install -r requirements.txt; fi
      - name: Verify installation
        run: |
          python --version
          pip --version
      - name: Install debug symbols
        run: |
          sudo apt-get update
          sudo apt-get install libc6-dbg
      - name: Build debugger and test applications
        run: |
          make build-rel
          make build-examples RUST_VERSION="$LRV"
      - name: Verify test applications and debugger rustc versions
        run: |
          strings ./target/release/bs | grep "rustc version" | grep "$MSRV"
          strings ./examples/target/debug/calc | grep "^rustc version" | grep "$LRV"
      - name: Run integration tests
        run: make int-test-rel

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Install rust
        run: |
          rustup toolchain install "$MSRV"
          rustup component add --toolchain "$MSRV" rustfmt clippy
          rustup override set "$MSRV"
      - name: Build debugger and test programs
        run: make build-all
      - name: Verify msrv
        run: "grep \"^rust-version = .$MSRV.\" Cargo.toml"
      - name: Run cargo fmt
        run: cargo fmt --all -- --check
      - name: Run cargo clippy
        run: cargo clippy -- -D warnings

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Install Nix
        uses: cachix/install-nix-action@ab739621df7a23f52766f9ccc97f38da6b7af14f  # v31.10.5
      - run: nix flake check

  # Linux/aarch64 build: catch regressions in the aarch64 port without
  # needing local Earthly. We run the latest supported rustc only — full
  # rustc-matrix coverage already exists for x86_64 above; aarch64 is
  # there to catch arch-specific breakages (register file, BRK opcode,
  # PC adjust, hardware-watchpoint regset, AAPCS64 inferior calls, …).
  # Hardware-watchpoint integration tests (`watchpoint::*`) are
  # `#[cfg]`-excluded on aarch64 because GitHub's hosted ARM runners do
  # not virtualise debug-exception delivery — see
  # `tests/debugger/main.rs` for the reasoning.
  test-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Install debug symbols
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-dbg
      - name: Install rust toolchain
        run: |
          rustup toolchain install "$LRV"
          rustup toolchain install "$MSRV"
      - name: Build test applications for functional testing
        run: make build-examples-for-func-test RUST_VERSION="$LRV"
      - name: Run library + functional tests
        run: cargo test
      - name: Run debugger integration tests
        run: cargo test --features int_test --test debugger -- --test-threads=1
      - name: Run DAP integration tests
        run: cargo test --features int_test --test dap

  lint-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Install rust
        run: |
          rustup toolchain install "$MSRV"
          rustup component add --toolchain "$MSRV" rustfmt clippy
          rustup override set "$MSRV"
      - name: Run cargo fmt
        run: cargo fmt --all -- --check
      - name: Run cargo clippy
        run: cargo clippy -- -D warnings
